openapi: 3.1.0
info:
  description: Send push notifications and Live Activities to your own devices via
    a single API key.
  title: ActivitySmith API
  version: 1.0.0
servers:
- url: https://activitysmith.com/api
security:
- apiKeyAuth: []
tags:
- description: Unauthenticated service information and public product updates.
  name: Public
- description: Send push notifications to paired devices.
  name: PushNotifications
- description: Update App Icon Badge Counts on paired devices.
  name: AppIconBadges
- description: "Start, update, stream, and end Live Activities."
  name: LiveActivities
- description: Update metric values shown in ActivitySmith widgets.
  name: Metrics
paths:
  /health:
    get:
      description: Returns the current availability of the ActivitySmith API and its
        required services. No authentication is required.
      operationId: getApiHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: The API and its required services are available.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: One or more required services are unavailable.
      security: []
      summary: Get API Health
      tags:
      - Public
  /changelog:
    get:
      description: Returns published ActivitySmith app changelog entries. No authentication
        is required.
      operationId: listPublicChangelogEntries
      parameters:
      - description: Platform whose published changelog entries should be returned.
        explode: true
        in: query
        name: platform
        required: false
        schema:
          default: ios
          type: string
        style: form
      - description: Maximum number of entries to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 20
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangelogListResponse'
          description: Published changelog entries ordered from newest to oldest.
      security: []
      summary: List Public Changelog Entries
      tags:
      - Public
  /badge:
    post:
      description: Shows a number on the ActivitySmith app icon.
      operationId: updateAppIconBadgeCount
      requestBody:
        content:
          application/json:
            examples:
              set_count:
                value:
                  badge: 8333
              clear_count:
                value:
                  badge: 0
              channel_targeted:
                value:
                  badge: 3
                  target:
                    channels:
                    - sales
                    - customer-success
            schema:
              $ref: '#/components/schemas/AppIconBadgeCountUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    badge: 8333
                    devices_updated: 2
                    users_updated: 1
                    effective_channel_slugs: null
                    timestamp: 2026-07-10T12:00:00.000Z
                channel_targeted:
                  value:
                    success: true
                    badge: 3
                    devices_updated: 2
                    users_updated: 1
                    effective_channel_slugs:
                    - sales
                    - customer-success
                    timestamp: 2026-07-10T12:00:00.000Z
              schema:
                $ref: '#/components/schemas/AppIconBadgeCountUpdateResponse'
          description: App Icon Badge Count updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updateAppIconBadgeCount_422_response'
          description: "No matching devices found, or a targeted device needs to reconnect"
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIconBadgeCountUpdateError'
          description: App Icon Badge Count could not be updated
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate limit exceeded
      summary: Set App Icon Badge Count
      tags:
      - AppIconBadges
      x-codeSamples:
      - lang: javascript
        label: Node
        source: await activitysmith.badgeCount(8333);
      - lang: python
        label: Python
        source: activitysmith.badge_count(8333)
      - lang: go
        label: Go
        source: activitysmith.BadgeCount(8333)
      - lang: php
        label: PHP
        source: $activitysmith->badgeCount(8333);
      - lang: ruby
        label: Ruby
        source: activitysmith.badge_count(8333)
      - lang: bash
        label: CLI
        source: activitysmith badge 8333
      - lang: bash
        label: cURL
        source: |-
          curl -X POST "https://activitysmith.com/api/badge" \
            -H "Authorization: Bearer $ACTIVITYSMITH_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "badge": 8333
            }'
  /push-notification:
    post:
      description: "Sends a push notification to devices matched by API key scope\
        \ and optional target channels. Supports optional redirection URL, optional\
        \ media preview or playback when the notification is expanded, and up to 4\
        \ interactive actions. `media` cannot be combined with `actions`. Optional\
        \ tags to organize and filter notification history."
      operationId: sendPushNotification
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  title: New subscription 💸
                  message: Customer upgraded to Pro plan
              channel_targeted:
                value:
                  title: New subscription 💸
                  message: Customer upgraded to Pro plan
                  target:
                    channels:
                    - devs
                    - ops
              redirection:
                value:
                  title: Incident Resolved ✅
                  message: All systems operational
                  redirection: https://status.example.com/incidents/abc-123
              media_preview:
                value:
                  title: Homepage ready
                  message: Your agent finished the redesign.
                  media: https://cdn.example.com/output/homepage.png
              media_preview_with_redirection:
                value:
                  title: Homepage ready
                  message: Your agent finished the redesign.
                  media: https://cdn.example.com/output/homepage.png
                  redirection: https://github.com/acme/web/pull/482
              actions_open_url:
                value:
                  title: Release Candidate Ready 🚀
                  message: v2.14.0-rc.1 deployed to staging
                  actions:
                  - title: View CI Run
                    type: open_url
                    url: https://github.com/activitysmithhq/backend/actions/runs/1234567890
                  - title: Release Notes
                    type: open_url
                    url: https://github.com/activitysmithhq/backend/releases/tag/v2.14.0-rc.1
              actions_webhook:
                value:
                  title: Build Failed 🚨
                  message: Tap and hold for remediation actions
                  redirection: https://ci.example.com/builds/8842
                  actions:
                  - title: Retry Build
                    type: webhook
                    url: https://hooks.example.com/activitysmith/build-retry
                    method: POST
                    body:
                      build_id: "8842"
                      source: push_action
              tagged:
                summary: Organize notification history with tags
                value:
                  title: New subscription 💸
                  message: Customer upgraded to Pro plan
                  tags:
                  - user:382
                  - billing
            schema:
              $ref: '#/components/schemas/PushNotificationRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    success: true
                    devices_notified: 2
                    users_notified: 1
                    timestamp: 2025-08-12T12:00:00.000Z
                channel_targeted:
                  value:
                    success: true
                    devices_notified: 2
                    users_notified: 1
                    effective_channel_slugs:
                    - devs
                    - ops
                    timestamp: 2025-08-12T12:00:00.000Z
                tagged:
                  value:
                    success: true
                    devices_notified: 2
                    users_notified: 1
                    effective_channel_slugs: null
                    tags:
                    - user:382
                    - billing
                    timestamp: 2025-08-12T12:00:00.000Z
              schema:
                $ref: '#/components/schemas/PushNotificationResponse'
          description: Push notification sent
        "400":
          content:
            application/json:
              examples:
                invalid_target:
                  value:
                    error: Invalid channel targeting
                    message: target.channels must be an array of channel slugs
                invalid_tags:
                  value:
                    error: Invalid tags
                    code: invalid_tags
                    message: "tags must use 1-64 lowercase letters, numbers, dashes,\
                      \ underscores, periods, or colons"
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad request (invalid payload or channel targeting input)
        "403":
          content:
            application/json:
              examples:
                channel_scope_violation:
                  value:
                    error: Invalid channel targeting
                    message: This API key can only target assigned channels. Requested
                      channels include channels outside this key scope.
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: Forbidden (API key scope or channel assignment violation)
        "404":
          content:
            application/json:
              examples:
                no_devices:
                  value:
                    error: No recipients found
                    message: No devices matched the effective channel target
                    effective_channel_slugs:
                    - marketing
              schema:
                $ref: '#/components/schemas/NoRecipientsError'
          description: No recipients found for effective channel target
        "429":
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error: Rate limit exceeded
                    message: "Too many requests, please try again later."
              schema:
                $ref: '#/components/schemas/sendPushNotification_429_response'
          description: Rate limit exceeded
      summary: Send a push notification
      tags:
      - PushNotifications
      x-codeSamples:
      - lang: javascript
        label: Node
        source: |-
          import ActivitySmith from "activitysmith";

          const activitysmith = new ActivitySmith({
            apiKey: process.env.ACTIVITYSMITH_API_KEY,
          });

          await activitysmith.notifications.send({
            title: "New subscription 💸",
            message: "Customer upgraded to Pro plan",
          });
      - lang: python
        label: Python
        source: |-
          import os
          from activitysmith import ActivitySmith

          activitysmith = ActivitySmith(api_key=os.environ["ACTIVITYSMITH_API_KEY"])

          activitysmith.notifications.send({
              "title": "New subscription 💸",
              "message": "Customer upgraded to Pro plan",
          })
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"log\"\n\n\tactivitysmithsdk \"github.com/ActivitySmithHQ/activitysmith-go\"\
          \n)\n\nfunc main() {\n\tactivitysmith, err := activitysmithsdk.New(\"YOUR-API-KEY\"\
          )\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t_, err = activitysmith.Notifications.Send(activitysmithsdk.PushNotificationInput{\n\
          \t\tTitle:   \"New subscription 💸\",\n\t\tMessage: \"Customer upgraded\
          \ to Pro plan\",\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n}"
      - lang: php
        label: PHP
        source: |-
          <?php

          use ActivitySmith\ActivitySmith;

          $activitysmith = new ActivitySmith($_ENV['ACTIVITYSMITH_API_KEY']);

          $activitysmith->notifications->send([
              'title' => 'New subscription 💸',
              'message' => 'Customer upgraded to Pro plan',
          ]);
      - lang: ruby
        label: Ruby
        source: |-
          require "activitysmith"

          activitysmith = ActivitySmith::Client.new(api_key: ENV.fetch("ACTIVITYSMITH_API_KEY"))

          activitysmith.notifications.send(
            title: "New subscription 💸",
            message: "Customer upgraded to Pro plan"
          )
      - lang: bash
        label: cURL
        source: |-
          curl -X POST "https://activitysmith.com/api/push-notification" \
            -H "Authorization: Bearer $ACTIVITYSMITH_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "New subscription 💸",
              "message": "Customer upgraded to Pro plan"
            }'
  /live-activity/stream/{stream_key}:
    delete:
      description: "Use this endpoint when the process you are tracking is finished\
        \ and you no longer want the Live Activity on your devices. ActivitySmith\
        \ ends the current Live Activity for this stream and dismisses it from devices.\
        \ If you need direct lifecycle control, use /live-activity/start, /live-activity/update,\
        \ and /live-activity/end instead. Use secondary_action for a second button\
        \ on alert, progress, and segmented_progress Live Activities."
      operationId: endLiveActivityStream
      parameters:
      - description: "Stable identifier for one ongoing thing. Allowed characters:\
          \ letters, numbers, underscores, and hyphens."
        explode: false
        in: path
        name: stream_key
        required: true
        schema:
          maxLength: 255
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              default:
                value: {}
              with_content_state:
                value:
                  content_state:
                    title: Server Health
                    subtitle: prod-web-1
                    type: metrics
                    metrics:
                    - label: CPU
                      value: 0
                      unit: '%'
                    - label: MEM
                      value: 0
                      unit: '%'
                    auto_dismiss_minutes: 2
            schema:
              $ref: '#/components/schemas/LiveActivityStreamDeleteRequest'
        required: false
      responses:
        "200":
          content:
            application/json:
              examples:
                ended:
                  value:
                    success: true
                    operation: ended
                    stream_key: prod-web-1
                    activity_id: h8QmSyYFTuwOIF6Wh3YcZlzHLhUcr034
                    devices_queued: 1
                    timestamp: 2025-08-12T12:10:00.000Z
                already_inactive:
                  value:
                    success: true
                    operation: ended
                    stream_key: prod-web-1
                    activity_id: null
                    timestamp: 2025-08-12T12:10:00.000Z
              schema:
                $ref: '#/components/schemas/LiveActivityStreamDeleteResponse'
          description: Managed stream ended
        "400":
          content:
            application/json:
              examples:
                invalid_stream_key:
                  value:
                    error: Invalid stream_key
                    message: "stream_key must contain only letters, numbers, underscores,\
                      \ and hyphens"
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: Bad request (invalid stream_key or action)
        "404":
          content:
            application/json:
              examples:
                not_found:
                  value:
                    error: Live Activity stream not found
                    message: "No Live Activity stream found for stream_key: prod-web-1"
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: Managed stream not found
        "429":
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error: Rate limit exceeded
                    message: "Too many requests, please try again later."
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate limit exceeded
      summary: End a stream
      tags:
      - LiveActivities
      x-codeSamples:
      - lang: javascript
        label: Node
        source: |-
          import ActivitySmith from "activitysmith";

          const activitysmith = new ActivitySmith({
            apiKey: process.env.ACTIVITYSMITH_API_KEY,
          });

          await activitysmith.liveActivities.endStream("prod-web-1", {
            content_state: {
              title: "Server Health",
              subtitle: "prod-web-1",
              type: "metrics",
              metrics: [
                { label: "CPU", value: 7, unit: "%" },
                { label: "MEM", value: 38, unit: "%" },
              ],
            },
          });
      - lang: python
        label: Python
        source: |-
          import os
          from activitysmith import ActivitySmith

          activitysmith = ActivitySmith(api_key=os.environ["ACTIVITYSMITH_API_KEY"])

          activitysmith.live_activities.end_stream(
              "prod-web-1",
              {
                  "content_state": {
                      "title": "Server Health",
                      "subtitle": "prod-web-1",
                      "type": "metrics",
                      "metrics": [
                          {"label": "CPU", "value": 7, "unit": "%"},
                          {"label": "MEM", "value": 38, "unit": "%"},
                      ],
                  },
              },
          )
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"log\"\n\n\tactivitysmithsdk \"github.com/ActivitySmithHQ/activitysmith-go\"\
          \n\t\"github.com/ActivitySmithHQ/activitysmith-go/generated\"\n)\n\nfunc\
          \ main() {\n\tactivitysmith, err := activitysmithsdk.New(\"YOUR-API-KEY\"\
          )\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t_, err = activitysmith.LiveActivities.EndStream(\"\
          prod-web-1\", activitysmithsdk.LiveActivityStreamEndInput{\n\t\tTitle: \
          \   \"Server Health\",\n\t\tSubtitle: \"prod-web-1\",\n\t\tType:     \"\
          metrics\",\n\t\tMetrics: []generated.ActivityMetric{\n\t\t\t{Label: \"CPU\"\
          , Value: 7, Unit: generated.PtrString(\"%\")},\n\t\t\t{Label: \"MEM\", Value:\
          \ 38, Unit: generated.PtrString(\"%\")},\n\t\t},\n\t})\n\tif err != nil\
          \ {\n\t\tlog.Fatal(err)\n\t}\n}"
      - lang: php
        label: PHP
        source: |-
          <?php

          use ActivitySmith\ActivitySmith;

          $activitysmith = new ActivitySmith($_ENV['ACTIVITYSMITH_API_KEY']);

          $activitysmith->liveActivities->endStream('prod-web-1', [
              'content_state' => [
                  'title' => 'Server Health',
                  'subtitle' => 'prod-web-1',
                  'type' => 'metrics',
                  'metrics' => [
                      ['label' => 'CPU', 'value' => 7, 'unit' => '%'],
                      ['label' => 'MEM', 'value' => 38, 'unit' => '%'],
                  ],
              ],
          ]);
      - lang: ruby
        label: Ruby
        source: |-
          require "activitysmith"

          activitysmith = ActivitySmith::Client.new(api_key: ENV.fetch("ACTIVITYSMITH_API_KEY"))

          activitysmith.live_activities.end_stream(
            "prod-web-1",
            {
              content_state: {
                title: "Server Health",
                subtitle: "prod-web-1",
                type: "metrics",
                metrics: [
                  { label: "CPU", value: 7, unit: "%" },
                  { label: "MEM", value: 38, unit: "%" }
                ]
              }
            }
          )
      - lang: bash
        label: cURL
        source: |-
          curl -X DELETE "https://activitysmith.com/api/live-activity/stream/prod-web-1" \
            -H "Authorization: Bearer $ACTIVITYSMITH_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "content_state": {
                "title": "Server Health",
                "subtitle": "prod-web-1",
                "type": "metrics",
                "metrics": [
                  { "label": "CPU", "value": 7, "unit": "%" },
                  { "label": "MEM", "value": 38, "unit": "%" }
                ]
              }
            }'
    put:
      description: "Use a stable stream_key for each ongoing thing you want to show\
        \ as a Live Activity. Send the latest content_state whenever it changes, and\
        \ ActivitySmith will keep the Live Activity in sync. For timer streams, send\
        \ duration_seconds to start or reset the timer; omit duration_seconds on later\
        \ updates to preserve the existing timer window. Use secondary_action for\
        \ a second button on alert, progress, and segmented_progress Live Activities.\
        \ Optional tags to organize and filter notification history. On later stream\
        \ updates, omit tags to keep the current tags, send tags again to replace\
        \ them, or send an empty array to clear them."
      operationId: reconcileLiveActivityStream
      parameters:
      - description: "Stable identifier for one ongoing thing. Allowed characters:\
          \ letters, numbers, underscores, and hyphens."
        explode: false
        in: path
        name: stream_key
        required: true
        schema:
          maxLength: 255
          pattern: "^[A-Za-z0-9_-]+$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            examples:
              metrics:
                value:
                  content_state:
                    title: Server Health
                    subtitle: prod-web-1
                    type: metrics
                    metrics:
                    - label: CPU
                      value: 27
                      unit: '%'
                    - label: MEM
                      value: 64
                      unit: '%'
              channel_targeted:
                value:
                  channels:
                  - ops
                  content_state:
                    title: Server Health
                    subtitle: prod-web-1
                    type: metrics
                    metrics:
                    - label: CPU
                      value: 27
                      unit: '%'
                    - label: MEM
                      value: 64
                      unit: '%'
              timer:
                value:
                  content_state:
                    title: Benchmark Run
                    subtitle: sampling
                    type: timer
                    duration_seconds: 300
                    color: cyan
              approval_secondary_actions:
                value:
                  content_state:
                    title: Approval Needed
                    message: Should I send the follow-up email to Brightlane?
                    type: alert
                    color: cyan
                  action:
                    title: Send
                    type: webhook
                    url: https://example.com/hooks/approvals/send
                    method: POST
                    body:
                      approval_id: appr_123
                  secondary_action:
                    title: Deny
                    type: webhook
                    url: https://example.com/hooks/approvals/deny
                    method: POST
                    body:
                      approval_id: appr_123
              tagged:
                summary: Organize notification history with tags
                value:
                  content_state:
                    title: Search Reindex
                    subtitle: catalog-v2
                    type: progress
                    percentage: 42
                  tags:
                  - user:382
                  - search-reindex
            schema:
              $ref: '#/components/schemas/LiveActivityStreamRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                started:
                  value:
                    success: true
                    operation: started
                    stream_key: prod-web-1
                    activity_id: h8QmSyYFTuwOIF6Wh3YcZlzHLhUcr034
                    devices_notified: 2
                    timestamp: 2025-08-12T12:00:00.000Z
                noop:
                  value:
                    success: true
                    operation: noop
                    stream_key: prod-web-1
                    activity_id: h8QmSyYFTuwOIF6Wh3YcZlzHLhUcr034
                    timestamp: 2025-08-12T12:05:00.000Z
                paused:
                  value:
                    success: true
                    operation: paused
                    stream_key: prod-web-1
                    activity_id: null
                    timestamp: 2025-08-12T12:10:00.000Z
                tagged:
                  value:
                    success: true
                    operation: started
                    stream_key: search-reindex
                    activity_id: h8QmSyYFTuwOIF6Wh3YcZlzHLhUcr034
                    devices_notified: 2
                    tags:
                    - user:382
                    - search-reindex
                    timestamp: 2025-08-12T12:00:00.000Z
              schema:
                $ref: '#/components/schemas/LiveActivityStreamPutResponse'
          description: Stream reconciled
        "400":
          content:
            application/json:
              examples:
                invalid_stream_key:
                  value:
                    error: Invalid stream_key
                    message: "stream_key must contain only letters, numbers, underscores,\
                      \ and hyphens"
                invalid_target:
                  value:
                    error: Invalid channel targeting
                    message: channels must contain at least one channel
                invalid_tags:
                  value:
                    error: Invalid tags
                    code: invalid_tags
                    message: tags must contain at most 20 unique values
              schema:
                $ref: '#/components/schemas/BadRequestError'
          description: "Bad request (invalid stream_key, payload, action, or channel\
            \ targeting input)"
        "403":
          content:
            application/json:
              examples:
                channel_scope_violation:
                  value:
                    error: Invalid channel targeting
                    message: This API key can only target assigned channels. Requested
                      channels include channels outside this key scope.
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: Forbidden (API key scope or channel assignment violation)
        "404":
          content:
            application/json:
              examples:
                no_devices:
                  value:
                    error: No recipients found
                    message: No Live Activity devices matched the effective channel
                      target
                    effective_channel_slugs:
                    - ops
              schema:
                $ref: '#/components/schemas/NoRecipientsError'
          description: No recipients found for effective channel target
        "429":
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error: Rate limit exceeded
                    message: "Too many requests, please try again later."
                concurrent_live_activity_limit_reached:
                  value:
                    error: Live Activity limit reached
                    message: iOS supports up to 5 concurrent Live Activities per app
                      on a device. End an active Live Activity before starting another.
                    limit: 5
                    active: 5
              schema:
                $ref: '#/components/schemas/sendPushNotification_429_response'
          description: Rate limit exceeded
      summary: Start a new Live Activity or update an existing one
      tags:
      - LiveActivities
      x-activitysmith-lifecycle: recommended_managed
      x-codeSamples:
      - lang: javascript
        label: Node
        source: |-
          import ActivitySmith from "activitysmith";

          const activitysmith = new ActivitySmith({
            apiKey: process.env.ACTIVITYSMITH_API_KEY,
          });

          await activitysmith.liveActivities.stream("search-reindex", {
            content_state: {
              title: "Search Reindex",
              subtitle: "catalog-v2",
              type: "progress",
              percentage: 42,
            },
          });
      - lang: python
        label: Python
