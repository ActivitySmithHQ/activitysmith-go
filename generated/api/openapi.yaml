  /metrics/{key}/value:
    post:
      description: "Updates the latest value for a metric displayed in ActivitySmith\
        \ widgets. Create the metric in the web app first, then update its value using\
        \ the key."
      operationId: updateMetricValue
      parameters:
      - description: "Metric key configured in the web app. Lowercase letters, numbers,\
          \ dots, underscores, and dashes are allowed."
        explode: false
        in: path
        name: key
        required: true
        schema:
          maxLength: 64
          minLength: 1
          pattern: "^[a-z0-9][a-z0-9_.-]{0,63}$"
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              value: 42
            schema:
              $ref: '#/components/schemas/MetricValueUpdateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                success:
                  value:
                    success: true
              schema:
                $ref: '#/components/schemas/MetricValueUpdateResponse'
          description: Metric value updated
        "400":
          content:
            application/json:
              examples:
                invalid_value:
                  value:
                    error: value must be a finite number
              schema:
                $ref: '#/components/schemas/MetricError'
          description: Bad request (invalid key or value)
        "404":
          content:
            application/json:
              examples:
                not_found:
                  value:
                    error: Metric not found
              schema:
                $ref: '#/components/schemas/MetricError'
          description: Metric not found
        "429":
          content:
            application/json:
              examples:
                rate_limited:
                  value:
                    error: Rate limit exceeded
                    message: "Too many requests, please try again later."
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate limit exceeded
      summary: Update a widget metric value
      tags:
      - Metrics
      x-codeSamples:
      - lang: javascript
        label: Node
        source: |-
          import ActivitySmith from "activitysmith";

          const activitysmith = new ActivitySmith({
            apiKey: process.env.ACTIVITYSMITH_API_KEY,
          });

          await activitysmith.metrics.update("deploy.success_rate", 99.9);
      - lang: python
        label: Python
        source: |-
          import os
          from activitysmith import ActivitySmith

          activitysmith = ActivitySmith(api_key=os.environ["ACTIVITYSMITH_API_KEY"])

          activitysmith.metrics.update("deploy.success_rate", 99.9)
      - lang: go
        label: Go
        source: "package main\n\nimport (\n\t\"log\"\n\n\tactivitysmithsdk \"github.com/ActivitySmithHQ/activitysmith-go\"\
          \n)\n\nfunc main() {\n\tactivitysmith, err := activitysmithsdk.New(\"YOUR-API-KEY\"\
          )\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t_, err = activitysmith.Metrics.Update(\"\
          deploy.success_rate\", 99.9)\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t\
          }\n}"
